<section class="mx-5 mb-4">
  <h1 class="text-2xl font-bold">Pipes númericos</h1>
  <h3 class="text-xl font-thin">Pipes incluidos en Angular</h3>
</section>

<div class="stats stats-vertical lg:stats-horizontal shadow w-full mb-4">
  <div class="stat">
    <div class="stat-title">Number</div>
    <div class="stat-value text-primary">{{ totalSells() | number }}</div>
    <div class="stat-desc">Original: {{totalSells()}}</div>
  </div>

  <div class="stat">
    <div class="stat-title">Percent</div>
    <div class="stat-value text-secondary">{{ percentage() | percent }}</div>
    <div class="stat-desc">Original: {{percentage()}}</div>
  </div>

  <div class="stat">
    <div class="stat-title">Currency</div>
    <div class="stat-value text-accent">{{ totalSells() | currency: "EUR" : "symbol-narrow" }}</div>
    <div class="stat-desc">Original: {{totalSells()}}</div>
  </div>
</div>
