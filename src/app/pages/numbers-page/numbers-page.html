<section class="mx-5">
  <h1 class="text-2xl font-bold">Pipes númericos</h1>
  <h3 class="text-xl font-thin">Pipes incluidos en Angular</h3>
</section>

<div class="stats stats-vertical lg:stats-horizontal shadow w-full">
  <div class="stat">
    <div class="stat-title">Number</div>
    <div class="stat-value">{{ totalSells() | number }}</div>
    <div class="stat-desc">{{totalSells()}}</div>
  </div>

  <div class="stat">
    <div class="stat-title">Percent</div>
    <div class="stat-value">{{ percentage() | percent }}</div>
    <div class="stat-desc">{{percentage()}}</div>
  </div>

  <div class="stat">
    <div class="stat-title">Currency</div>
    <div class="stat-value">{{ totalSells() | currency: "EUR" : "symbol-narrow" }}</div>
    <div class="stat-desc">{{totalSells()}}</div>
  </div>
</div>
